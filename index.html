<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>TikTok • Soạn tin hoàn tiền</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#20262b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tin hoàn tiền">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <script src="./pwa.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20262b; background: #f5f5f1; }
    body { margin: 0; }
    button, input, textarea { font: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    :focus-visible { outline: 3px solid #13877d; outline-offset: 3px; }
    .wrap { max-width: 960px; padding: 22px 18px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid #ddded7; }
    .brand { display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 17px; }
    .brand-icon { display: grid; place-items: center; width: 36px; height: 36px; background: #20262b; color: #fff; border-radius: 10px; font-size: 20px; }
    .badge { color: #487061; background: #e6eee6; border-radius: 30px; padding: 6px 12px; font-size: 12px; white-space: nowrap; }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    .card { background: #fff; border: 1px solid #e0e3db; border-radius: 16px; padding: 20px; }
    h2 { font-size: 16px; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
    .step { display: inline-grid; place-items: center; font-size: 12px; background: #f0f2ee; color: #586258; width: 24px; height: 24px; border-radius: 50%; font-weight: 600; }
    .field-header { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 6px; }
    .field-header label { margin: 0; }
    .btn-paste { min-height: 30px; height: 30px; padding: 0 10px; font-size: 12.5px; font-weight: 600; border-radius: 7px; background: #eaf0e6; border: 1px solid #d2dfce; color: #2e5939; display: inline-flex; align-items: center; gap: 4px; }
    .btn-paste:active { background: #d7e6d2; }
    label { display: block; font-size: 13.5px; font-weight: 650; margin: 14px 0 6px; }
    label:first-of-type { margin-top: 0; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #d9ded5; border-radius: 9px; min-height: 46px; background: #fbfcfa; color: #20262b; font-size: 15px; }
    input[aria-invalid="true"] { border-color: #ba3838; }
    .actions { display: flex; gap: 8px; margin-top: 18px; }
    button { min-height: 46px; border-radius: 10px; font-weight: 650; padding: 10px 16px; border: 1px solid #d9ded5; background: #fff; color: #333d36; }
    .primary { flex: 1; border-color: #20262b; color: white; background: #20262b; }
    .primary:hover { background: #35443d; }
    .message-card { background: #fcfcfa; }
    .message-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .message-heading span:last-child { color: #80877e; font-size: 12px; }
    textarea { display: block; width: 100%; min-height: 150px; resize: vertical; padding: 16px; border: 1px solid #dfe4da; border-radius: 12px; background: #fff; font-size: 15px; line-height: 1.6; color: #2a3430; }
    textarea::placeholder { color: #8c948b; font-size: 13.5px; }
    .copy { background: #20262b; border-color: #20262b; color: #fff; width: 100%; margin-top: 16px; font-size: 15px; font-weight: 650; min-height: 48px; transition: background-color 0.2s, border-color 0.2s, transform 0.1s; }
    .copy:not(:disabled):hover { background: #35443d; border-color: #35443d; }
    .copy:not(:disabled):active { transform: scale(0.99); }
    .copy.copied { background: #205e39 !important; border-color: #205e39 !important; color: #fff !important; }
    .feedback { min-height: 20px; margin: 10px 0 0; font-size: 13px; line-height: 1.4; color: #316546; }
    .feedback.error { color: #a42c2c; }
    footer { margin-top: 20px; font-size: 12px; color: #868c81; text-align: center; }
    .install { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid #d9e4d7; background: #eaf0e5; border-radius: 12px; }
    .install p { flex: 1 1 230px; margin: 0; font-size: 13px; color: #466047; line-height: 1.5; }
    dialog { max-width: min(440px, calc(100% - 32px)); padding: 24px; border: 1px solid #d9ded5; border-radius: 18px; color: #20262b; }
    dialog::backdrop { background: #20262b80; }
    dialog p { line-height: 1.6; }
    [hidden] { display: none !important; }
    @media (max-width: 720px) {
      .wrap { padding: 14px 12px 28px; }
      header { padding-bottom: 12px; margin-bottom: 14px; }
      .layout { grid-template-columns: 1fr; gap: 14px; }
      .card { padding: 16px 14px; border-radius: 14px; }
      h2 { font-size: 15px; margin-bottom: 14px; }
      label { font-size: 13px; margin: 12px 0 5px; }
      .field-header { margin: 12px 0 5px; }
      input, textarea { font-size: 16px !important; } /* Ngăn iOS Safari tự zoom */
      input { min-height: 44px; padding: 10px 12px; }
      textarea { min-height: 130px; padding: 12px; font-size: 15px !important; }
      .actions { margin-top: 14px; gap: 8px; }
      button { min-height: 44px; }
      .copy { min-height: 48px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand"><span class="brand-icon" aria-hidden="true">↗</span> TikTok · Hoàn tiền</div>
      <span class="badge" id="pwaStatus" role="status">Công cụ độc lập</span>
    </header>
    <aside class="install" id="installPanel" hidden>
      <p>Cài ra màn hình chính để mở nhanh như app và sử dụng khi mất mạng.</p>
      <button type="button" id="installButton">Cài trên điện thoại</button>
    </aside>
    <dialog id="installGuide" aria-labelledby="installTitle">
      <h2 id="installTitle">Cài vào màn hình chính</h2>
      <p id="installInstructions"></p>
      <p>Nếu đang mở trong Zalo, hãy chọn mở bằng Safari hoặc Chrome trước.</p>
      <form method="dialog"><button>Đã hiểu</button></form>
    </dialog>
    <div class="layout">
      <section class="card" id="inputCard" aria-labelledby="inputTitle">
        <h2 id="inputTitle"><span class="step">1</span> Thông tin affiliate</h2>
        <form id="replyForm" novalidate>
          <div class="field-header">
            <label for="affiliateLink">Link affiliate TikTok</label>
            <button type="button" id="pasteLinkButton" class="btn-paste" title="Dán nhanh từ bộ nhớ tạm">📋 Dán link</button>
          </div>
          <input id="affiliateLink" type="url" inputmode="url" placeholder="https://vt.tiktok.com/..." maxlength="4000" autocomplete="off" required>

          <label for="commission">Hoa hồng gốc trước thuế (đ)</label>
          <input id="commission" type="text" inputmode="numeric" pattern="[0-9.,]*" placeholder="Ví dụ: 25000 hoặc 25.000" autocomplete="off" required>

          <label for="customMessage">Lời nhắn gửi khách</label>
          <input id="customMessage" type="text" placeholder="Đặt hàng qua link trên để nhận hoàn tiền nhé." autocomplete="off" maxlength="500">

          <div class="actions">
            <button class="primary" type="submit">Tạo tin nhắn ↗</button>
            <button id="resetButton" type="reset">Làm mới</button>
          </div>
          <p id="formStatus" class="feedback" role="status" aria-live="polite"></p>
        </form>
      </section>
      <section class="card message-card" id="outputCard" aria-labelledby="outputTitle">
        <div class="message-heading"><h2 id="outputTitle"><span class="step">2</span> Tin nhắn gửi khách</h2><span>Sẵn sàng cho Zalo</span></div>
        <textarea id="replyOutput" readonly aria-label="Nội dung tin nhắn" placeholder="Tin nhắn sẽ tự động tạo tại đây khi dán link và nhập hoa hồng."></textarea>
        <button id="copyButton" type="button" class="copy" disabled>Sao chép tin nhắn</button>
        <p id="copyStatus" class="feedback" role="status" aria-live="polite"></p>
      </section>
    </div>
    <footer>Công cụ độc lập · Không lưu dữ liệu</footer>
  </main>
  <script>
    (() => {
      const byId = id => document.getElementById(id);
      const form = byId('replyForm');
      const linkInput = byId('affiliateLink');
      const commissionInput = byId('commission');
      const customMessageInput = byId('customMessage');
      const pasteLinkBtn = byId('pasteLinkButton');
      const output = byId('replyOutput');
      const copyButton = byId('copyButton');
      const outputCard = byId('outputCard');
      const money = value => `${value.toLocaleString('vi-VN')}đ`;

      const STORAGE_KEY = 'tiktok_cashback_custom_note';
      const DEFAULT_NOTE = 'Đặt hàng qua link trên để nhận hoàn tiền nhé.';
      let revision = 0;

      // Khôi phục lời nhắn đã lưu hoặc dùng mặc định
      const savedNote = localStorage.getItem(STORAGE_KEY);
      customMessageInput.value = (savedNote !== null && savedNote !== undefined) ? savedNote : DEFAULT_NOTE;

      // Tự động lưu khi sửa lời nhắn & cập nhật kết quả ngay
      customMessageInput.addEventListener('input', () => {
        localStorage.setItem(STORAGE_KEY, customMessageInput.value);
        tryAutoGenerate();
      });

      function clearResult() {
        revision++;
        output.value = '';
        copyButton.disabled = true;
        copyButton.textContent = 'Sao chép tin nhắn';
        copyButton.classList.remove('copied');
        byId('copyStatus').textContent = '';
        byId('formStatus').textContent = '';
        byId('formStatus').classList.remove('error');
        linkInput.removeAttribute('aria-invalid');
        commissionInput.removeAttribute('aria-invalid');
      }

      function fail(input, message) {
        byId('formStatus').textContent = message;
        byId('formStatus').classList.add('error');
        input.setAttribute('aria-invalid', 'true');
        input.focus();
      }

      function computeCashback(rawCommission) {
        if (!/^(?:\d+|\d{1,3}(?:\.\d{3})+|\d{1,3}(?:,\d{3})+)$/.test(rawCommission)) return null;
        const gross = Number(rawCommission.replace(/[.,]/g, ''));
        if (!Number.isSafeInteger(gross) || gross > 1000000000000 || gross <= 0) return null;
        const tax = Math.round(gross * 0.1);
        const net = gross - tax;
        return Math.round(net * 0.7);
      }

      function isValidUrl(link) {
        try {
          const url = new URL(link);
          return url.protocol === 'https:' && !url.username && !url.password && !/\s/.test(link) && link.length <= 4000;
        } catch {
          return false;
        }
      }

      function tryAutoGenerate() {
        const link = linkInput.value.trim();
        const raw = commissionInput.value.trim();
        if (!link || !raw) return false;
        if (!isValidUrl(link)) return false;
        const cashback = computeCashback(raw);
        if (cashback === null) return false;

        const customNote = customMessageInput.value.trim() || DEFAULT_NOTE;
        output.value = [
          '🛒 Link đặt hàng TikTok:',
          link,
          `💰 Hoàn tiền ước tính: ${money(cashback)}`,
          customNote
        ].filter(Boolean).join('\n');

        copyButton.disabled = false;
        byId('formStatus').textContent = '';
        byId('formStatus').classList.remove('error');
        linkInput.removeAttribute('aria-invalid');
        commissionInput.removeAttribute('aria-invalid');
        return true;
      }

      // Nút dán nhanh link từ clipboard
      if (pasteLinkBtn) {
        pasteLinkBtn.addEventListener('click', async () => {
          try {
            if (navigator.clipboard?.readText) {
              const text = await navigator.clipboard.readText();
              if (text && text.trim()) {
                linkInput.value = text.trim();
                if (!tryAutoGenerate()) {
                  if (!commissionInput.value.trim()) {
                    commissionInput.focus();
                  }
                }
                return;
              }
            }
          } catch { /* Trình duyệt yêu cầu cấp quyền hoặc không hỗ trợ */ }
          linkInput.focus();
          linkInput.select();
        });
      }

      // Tự động tạo tin nhắn ngay khi gõ hoặc sửa
      form.addEventListener('input', event => {
        if (event.target === linkInput || event.target === commissionInput) {
          if (!tryAutoGenerate()) {
            clearResult();
          }
        }
      });

      // Khi bấm làm mới: CHỈ xóa link và hoa hồng, GIỮ NGUYÊN lời nhắn đã lưu
      form.addEventListener('reset', event => {
        event.preventDefault();
        linkInput.value = '';
        commissionInput.value = '';
        clearResult();
        linkInput.focus();
      });

      form.addEventListener('submit', event => {
        event.preventDefault();
        const link = linkInput.value.trim();
        if (!isValidUrl(link)) {
          clearResult();
          fail(linkInput, 'Dán một link affiliate đầy đủ, bắt đầu bằng https://.');
          return;
        }
        const raw = commissionInput.value.trim();
        const cashback = computeCashback(raw);
        if (cashback === null) {
          clearResult();
          fail(commissionInput, 'Nhập số đồng nguyên không âm, ví dụ 25000 hoặc 25.000.');
          return;
        }

        const customNote = customMessageInput.value.trim() || DEFAULT_NOTE;
        output.value = [
          '🛒 Link đặt hàng TikTok:',
          link,
          `💰 Hoàn tiền ước tính: ${money(cashback)}`,
          customNote
        ].filter(Boolean).join('\n');
        copyButton.disabled = false;
        byId('formStatus').textContent = 'Đã tạo tin nhắn! Bấm Sao chép để gửi khách.';

        // Tự cuộn mượt xuống Bước 2 trên màn hình điện thoại
        if (window.innerWidth <= 720 && outputCard) {
          outputCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });

      copyButton.addEventListener('click', async () => {
        const text = output.value;
        if (!text) return;
        const currentRevision = revision;
        copyButton.disabled = true;
        let copied = false;
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(text);
            copied = true;
          }
        } catch { /* File URLs và một số trình duyệt nhúng yêu cầu fallback */ }
        if (currentRevision !== revision) return;
        if (!copied) {
          output.focus();
          output.select();
          output.setSelectionRange(0, output.value.length);
          try { copied = document.execCommand('copy'); } catch { copied = false; }
        }
        copyButton.disabled = false;
        if (copied) {
          if (navigator.vibrate) {
            try { navigator.vibrate(40); } catch {}
          }
          copyButton.textContent = '✓ Đã sao chép tin nhắn!';
          copyButton.classList.add('copied');
          byId('copyStatus').textContent = 'Đã sao chép! Mở Zalo và dán vào cuộc trò chuyện.';
          setTimeout(() => {
            if (copyButton.classList.contains('copied')) {
              copyButton.textContent = 'Sao chép tin nhắn';
              copyButton.classList.remove('copied');
            }
          }, 3500);
        } else {
          byId('copyStatus').textContent = 'Nội dung đã được chọn. Nhấn Ctrl+C hoặc chạm giữ và chọn Sao chép.';
        }
      });
    })();
  </script>
</body>
</html>
